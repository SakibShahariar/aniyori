<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title desc">
  <title id="title">Aniyori</title>
  <desc id="desc">A mint leaf and letter A on a deep green rounded square.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4d38"/>
      <stop offset="0.55" stop-color="#17663f"/>
      <stop offset="1" stop-color="#0d3a28"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#f2fff7"/>
      <stop offset="0.55" stop-color="#b9f2cf"/>
      <stop offset="1" stop-color="#7fdca8"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <!-- App tile -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bg)"/>
  <rect x="25" y="25" width="462" height="462" rx="103" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>
  <path d="M128 128 Q128 48 208 48" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="16" stroke-linecap="round"/>

  <!-- Soft glow behind the mark -->
  <ellipse cx="256" cy="272" rx="118" ry="132" fill="#8ff0b7" opacity="0.13" filter="url(#soft)"/>

  <!-- Leaf that forms an A silhouette -->
  <path d="M256 92
           C 318 140, 372 206, 342 288
           C 322 344, 287 386, 256 420
           C 225 386, 190 344, 170 288
           C 140 206, 194 140, 256 92 Z"
        fill="url(#leaf)"/>

  <!-- A monogram formed inside the leaf -->
  <path d="M206 336 L256 172 L306 336"
        fill="none" stroke="#125538" stroke-opacity="0.82" stroke-width="22"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M224 282 H288"
        fill="none" stroke="#125538" stroke-opacity="0.82" stroke-width="18"
        stroke-linecap="round"/>

  <!-- Small highlight -->
  <path d="M256 112 C 288 148, 304 190, 286 230 C 266 190, 258 152, 256 112 Z"
        fill="#ffffff" opacity="0.30"/>
</svg>
